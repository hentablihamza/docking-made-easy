name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run test suite (no Vina binary, no network)
        run: pytest -v

      - name: CLI smoke test
        run: |
          dme --help
          dme doctor
          dme info tests/fixtures/mini_complex.pdb
          dme box tests/fixtures/mini_complex.pdb --ligand-res AQ4 --pocket
          dme parse tests/fixtures/vina_out.pdbqt

  example-outputs:
    name: committed example outputs are consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check the committed EGFR results against the report
        run: python examples/check_example_outputs.py
